version: "3.8"
services:
  plc:
    build:
      context: https://github.com/did-method-plc/did-method-plc.git
      dockerfile: packages/server/Dockerfile
    network_mode: host
    environment:
      - DATABASE_URL="postgres://example:example@localhost/plc_dev"
      - DEBUG_MODE=1
      - LOG_ENABLED="true"
      - LOG_LEVEL=debug
      - LOG_DESTINATION=1
      - PORT=7000
  pds1:
    container_name: pds
    image: ghcr.io/bluesky-social/pds:0.4
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: /pds
        target: /pds
    env_file:
      - ./pds/pds1.env
  pds2:
    container_name: pds
    image: ghcr.io/bluesky-social/pds:0.4
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: /pds
        target: /pds
    env_file:
      - ./pds/pds2.env
  bigsky: # https://github.com/bluesky-social/indigo/blob/main/cmd/bigsky/README.md
    image: "ghcr.io/bluesky-social/indigo:bigsky-fd66f93ce1412a3678a1dd3e6d53320b725978a6"
    container_name: bigsky
    network_mode: host
    restart: always
    volumes:
      - ./bigsky:/data
  jetstream: # https://github.com/bluesky-social/jetstream/blob/main/README.md
    image: ghcr.io/bluesky-social/jetstream:${JETSTREAM_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: jetstream
    network_mode: host
    volumes:
      - ./jetstream:/data
    environment:
      - JETSTREAM_DATA_DIR=/data
      - JETSTREAM_LIVENESS_TTL=15s
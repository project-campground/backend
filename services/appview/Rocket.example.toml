[default]
port = 3984

[default.core]
port = 3984
# hostname = "example.com"
verification_key = "hex-encoded secp256k1 private key here"
frontend = "https://localhost:5173"
did = "did:web:localhost%3A3984"

[default.database]
url = "postgresql://example:example@localhost/registry"
pool_size = 10

[default.identity]
plc_url = "https://plc.directory"
resolver_timeout = 15
cache_state_ttl = 15
cache_max_ttl = 15
service_handle_domains = ["example.com"]
enable_did_doc_with_session = false
nameservers = "localhost:3984"

[default.email]
provider = "SMTP"
host = "smtp.example.com"
username = "user@example.com"
password = "example"
from_address = "user@example.com"


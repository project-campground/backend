[package]
name = "backend_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
appview-schema = { version = "*", path = "../../libs/appview-schema" }
diesel = { version = "=2.3.1", features = ["chrono", "postgres", "r2d2"] }
reqwest = { version = "0.12.5", features = ["json"] }
tokio = { version = "1.28.2",features = ["full"] }
serde_json = "1.0.118"
lazy_static = "1.5.0"
dotenvy = "0.15.7"
serde = "1.0.203"
chrono = "0.4.24"
secp256k1 = { version = "0.31.1", features = ["global-context", "rand", "std", "hashes"] }
# rand = "0.10.0"
# sha2 = "0.10.9"
anyhow = "1.0.90"